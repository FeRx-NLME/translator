name: check

on:
  push:
    branches: [main]
  pull_request:

# One run per ref at a time. Without this, every push to a branch starts another
# ~19-minute engine build and none of the earlier ones stop: four concurrent runs
# accumulated on a single branch during one afternoon's work, three of them
# testing commits already superseded. The results of a superseded run are not
# just wasted, they are misleading -- a green tick against a commit nobody is
# looking at any more.
#
# Cancellation is deliberately NOT applied to main. There are no required status
# checks on this repo, so the engine job is the only thing that actually
# exercises the engine against what landed, and every commit on main needs its
# own verified result. Cancelling a main run to start a newer one would leave the
# older commit permanently unverified -- and on a branch where merges can land
# unreviewed, that is the one place the signal has to be complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Fast tier: R CMD check + unit/integration/snapshot tests. No engine, no Rust.
  # The Tier-4 concordance tests self-skip here (ferx is not installed, and CI is
  # set without the engine opt-in), so this job stays a couple of minutes.
  fast:
    runs-on: ubuntu-latest
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # ferx and amp.sim ARE declared in Suggests -- the package genuinely uses
      # them optionally -- but neither is on CRAN/RSPM, so resolving soft deps
      # here fails with "Can't find package called ferx". Install hard deps only
      # and name the CRAN-available soft deps this job actually needs. This job
      # therefore has no Rust toolchain and no engine build; the concordance
      # tests and the emitted-output validation both self-skip with ferx absent
      # (_R_CHECK_FORCE_SUGGESTS_ is false above, so the check tolerates it).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
            any::monolix2rx
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--ignore-vignettes")'
          build_args: 'c("--no-build-vignettes")'
          error-on: '"warning"'

  # Engine tier: build a PINNED ferx (Rust) and run the Tier-4 concordance tests
  # so a green check actually proves the engine accepts and fits the emitted
  # .ferx. The pin (ferx-r@9c97c13) must match the reference omegas asserted in
  # tests/testthat/test-concordance.R and the bundled datasets in inst/testdata/
  # (regenerated with this engine) -- bump them together. Pin the SHA rather than
  # the tag: a tag can be moved, and this job is the only thing standing between a
  # silent engine regression and a merge.
  #
  # 9c97c13 is ferx-r MAIN, not a tag, and that is deliberate. Both READMEs tell
  # users `pak::pak("FeRx-NLME/ferx-r")`, which takes the default branch -- so main
  # IS the version users install, and pinning the v0.3.0 tag would test a build
  # nobody runs. Note its DESCRIPTION still reads 0.3.0 even though the parser
  # changed underneath it, so "ferx 0.3.0" no longer names one engine: identify
  # this build by SHA, never by version.
  engine:
    runs-on: ubuntu-latest
    env:
      FERXTRANSLATE_ENGINE_TESTS: "true"
      FERX_NO_AUTODIFF: "1"   # stable-Rust path; Enzyme is not available/needed in CI
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: dtolnay/rust-toolchain@stable
      # Install the translator's hard deps plus, EXPLICITLY, the pinned engine
      # (ferx-r@9c97c13) and the amp.sim benchmark. Installing them
      # as explicit extra-packages (rather than via a DESCRIPTION Remote) lets
      # pak read each repo's own Package name, avoiding the repo-name vs
      # package-name mismatch (ferx-r -> ferx). The first run compiles the ferx
      # Rust crate (~minutes); the built package is cached for later runs.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::devtools
            any::testthat
            FeRx-NLME/ferx-r@9c97c13
            LeidenAdvancedPKPD/amp.sim
      # The FULL suite, not filter="concordance". Four of the validation tests are
      # skip_if_not_installed("ferx"), so a filtered run left the entire feature
      # this package validates with -- strict abort, diagnostics mapping,
      # $unsupported population -- executed by neither job. A filter also passes
      # green on zero matched tests, so a file rename would silently disable this.
      - name: Full suite incl. Tier-4 concordance (pinned ferx)
        run: Rscript -e 'devtools::test(stop_on_failure = TRUE)'
